<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水滴降临 · 三体 · Three.js</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; font-family: "Microsoft YaHei", sans-serif; }
  canvas { display: block; }
  #hud {
    position: fixed; bottom: 24px; left: 0; right: 0;
    text-align: center; color: rgba(180,220,255,0.75);
    font-size: 14px; letter-spacing: 4px; z-index: 10;
    text-shadow: 0 0 12px rgba(80,160,255,0.4);
    pointer-events: none;
  }
  #progress { position: fixed; top: 0; left: 0; height: 2px; background: rgba(80,180,255,0.6); z-index: 20; }
  #title {
    position: fixed; top: 8%; left: 0; right: 0; text-align: center;
    color: rgba(200,230,255,0.9); font-size: 28px; letter-spacing: 12px; z-index: 10;
    text-shadow: 0 0 20px rgba(120,190,255,0.6); pointer-events: none;
    opacity: 0; transition: opacity 2s;
  }
  #err {
    position: fixed; top: 8%; left: 5%; right: 5%; z-index: 99;
    color: #ff6666; background: rgba(30,0,0,0.85); font-size: 13px;
    white-space: pre-wrap; padding: 12px; border: 1px solid #ff4444;
    border-radius: 6px; font-family: Consolas, monospace; display: none;
  }
  .fade-in { opacity: 1 !important; }
</style>
</head>
<body>
<div id="title">水 滴 降 临</div>
<div id="progress"></div>
<div id="err"></div>
<div id="hud">毁灭你，与你有何相干 —— 三体</div>

<script>
window.addEventListener('error', function(e) {
  var el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = 'ERROR: ' + (e.message || e.error || 'unknown') + '\n' + (e.filename || '');
});
window.addEventListener('unhandledrejection', function(e) {
  var el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = 'REJECTION: ' + (e.reason && (e.reason.stack || e.reason.message || e.reason) || e.reason);
});
</script>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ============ 基础 ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020408);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 5000);
camera.position.set(60, 18, 90);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// 环境反射（水滴需要）
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;

// ============ 星空 ============
function makeStars(count, radius, size, color) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = radius * (0.7 + Math.random() * 0.3);
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.cos(phi);
    pos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    size, color, transparent: true, opacity: 0.9,
    sizeAttenuation: true, blending: THREE.AdditiveBlending, depthWrite: false
  });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);
  return pts;
}
const starsFar = makeStars(6000, 1800, 2.2, 0xaaccff);
const starsNear = makeStars(1500, 700, 3.2, 0xffffff);

// ============ 舰队（程序化生成恒星级战舰） ============
const fleet = new THREE.Group();
function buildWarship(seedScale = 1) {
  const ship = new THREE.Group();
  const hullMat = new THREE.MeshStandardMaterial({
    color: 0x3a4a5a, metalness: 0.85, roughness: 0.35, flatShading: false
  });
  const darkMat = new THREE.MeshStandardMaterial({
    color: 0x1a2430, metalness: 0.9, roughness: 0.5
  });
  const glowMat = new THREE.MeshStandardMaterial({
    color: 0x66ccff, emissive: 0x2266aa, emissiveIntensity: 1.2,
    metalness: 0.3, roughness: 0.4
  });

  // 主体（细长舰体）
  const hull = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 2.2, 16, 10), hullMat);
  hull.rotation.x = Math.PI / 2;
  ship.add(hull);

  // 前端（尖锐船首）
  const bow = new THREE.Mesh(new THREE.ConeGeometry(1.2, 5, 10), darkMat);
  bow.rotation.x = -Math.PI / 2;
  bow.position.z = 10.2;
  ship.add(bow);

  // 后端推进器
  const stern = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 2.4, 3, 10), darkMat);
  stern.rotation.x = Math.PI / 2;
  stern.position.z = -9.2;
  ship.add(stern);

  // 推进器光
  const thruster = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, 1.6, 10), glowMat);
  thruster.rotation.x = Math.PI / 2;
  thruster.position.z = -11;
  ship.add(thruster);

  // 舰桥
  const bridge = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 2.4), darkMat);
  bridge.position.set(0, 1.8, -1);
  ship.add(bridge);

  // 两侧翼
  for (const side of [-1, 1]) {
    const wing = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.25, 9), hullMat);
    wing.position.set(side * 2.1, -0.3, 1);
    ship.add(wing);
    const wingTip = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.4, 2.2), glowMat);
    wingTip.position.set(side * 2.7, -0.3, 6);
    ship.add(wingTip);
  }

  // 环带灯
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.6, 0.12, 8, 24), glowMat);
  ring.rotation.x = Math.PI / 2;
  ring.position.z = 3;
  ship.add(ring);

  ship.scale.setScalar(scaleSeed(seedScale));
  return ship;
}
function scaleSeed(s) { return s * (0.9 + Math.random() * 0.3); }

// 舰队编队：一排战舰，面向水滴来袭方向
const fleetPositions = [
  [-26, -6, 0], [26, -6, 0], [0, 4, 6], [-38, 2, -4], [38, 2, -4],
  [-14, 10, -8], [14, 10, -8], [0, -14, -2], [-50, -10, 6], [50, -10, 6]
];
fleetPositions.forEach((p, i) => {
  const s = buildWarship(1 + Math.random());
  s.position.set(p[0], p[1], p[2]);
  s.rotation.y = (Math.random() - 0.5) * 0.4;
  s.rotation.z = (Math.random() - 0.5) * 0.15;
  fleet.add(s);
});
scene.add(fleet);

// ============ 水滴 ============
const droplet = new THREE.Mesh(
  new THREE.SphereGeometry(1.0, 128, 128),
  new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    metalness: 1.0,
    roughness: 0.02,
    clearcoat: 1.0,
    clearcoatRoughness: 0.02,
    envMapIntensity: 1.5,
    emissive: 0x88ccff,
    emissiveIntensity: 0.06
  })
);
droplet.position.set(0, 0, -30);
scene.add(droplet);

// 水滴尾迹光
const trailLight = new THREE.PointLight(0x88ccff, 3, 40);
trailLight.position.copy(droplet.position);
scene.add(trailLight);

// 水滴光环（点缀）
const halo = new THREE.Mesh(
  new THREE.RingGeometry(1.35, 1.5, 64),
  new THREE.MeshBasicMaterial({
    color: 0x66bbff, transparent: true, opacity: 0.35,
    side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false
  })
);
halo.position.copy(droplet.position);
scene.add(halo);

// ============ 辅助光 ============
scene.add(new THREE.AmbientLight(0x223344, 0.5));
const keyLight = new THREE.DirectionalLight(0x88bbff, 1.2);
keyLight.position.set(40, 60, 80);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x4466aa, 0.8);
rimLight.position.set(-50, -20, -60);
scene.add(rimLight);

// ============ 后期（辉光） ============
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.6, 0.4, 0.85);
composer.addPass(bloom);

// ============ 动画 ============
const clock = new THREE.Clock();
const DURATION = 24; // 秒，总片长

// 镜头关键帧表：每段 [startT, endT, startPos, endPos, lookAt]
const shots = [
  [0,  4,  [46, 16, 95], [30, 8, 60],  [0, 0, 10]],    // 远景：舰队横列，水滴接近
  [4,  9,  [30, 8, 60],  [-15, 6, 38], [-20, 0, 0]],   // 推近舰队
  [9,  14, [-15, 6, 38], [8, 2, 26],   [10, -2, -15]], // 水滴划过
  [14, 19, [8, 2, 26],   [30, 10, 55], [-26, -6, 0]],  // 水滴逼近首舰
  [19, 24, [30, 10, 55], [40, 20, 80], [0, 0, -30]]    // 穿过爆炸，拉远收尾
];

function getShot(tt) {
  for (const [t0, t1, p0, p1, look] of shots) {
    if (tt >= t0 && tt <= t1) {
      const k = Math.min(1, Math.max(0, (tt - t0) / (t1 - t0)));
      const e = k * k * (3 - 2 * k); // smoothstep
      return {
        pos: [p0[0] + (p1[0] - p0[0]) * e, p0[1] + (p1[1] - p0[1]) * e, p0[2] + (p1[2] - p0[2]) * e],
        look
      };
    }
  }
  const last = shots[shots.length - 1];
  return { pos: last[3], look: last[4] };
}

let exploded = false;
let lastRender = 0;
function renderFrame() {
  const t = clock.getElapsedTime();
  const tt = t % DURATION;

  // 水滴运动：0-14s 从远处飞来；14s 后贯穿
  if (tt < 14) {
    const k = tt / 14;
    droplet.position.set(
      40 * (1 - k) * 0.6,
      -8 + 10 * k * k,
      -90 + 85 * k
    );
    droplet.rotation.y = tt * 0.3;
  } else {
    const k = (tt - 14) / 6;
    droplet.position.set(
      -26 + 30 * k,
      -6 + 4 * k,
      0 - 20 * k
    );
    droplet.rotation.y = tt * 0.3;
    // 14s 后照亮战场
    keyLight.intensity = 1.2 + 1.5 * Math.sin(k * Math.PI);
    trailLight.intensity = 3 + 6 * k;
    if (k > 0.5 && !exploded) {
      exploded = true;
      // 爆炸闪光
      const flash = new THREE.PointLight(0xff8844, 20, 100);
      flash.position.copy(droplet.position);
      scene.add(flash);
      setTimeout(() => scene.remove(flash), 1200);
    }
  }
  halo.position.copy(droplet.position);
  halo.lookAt(camera.position);
  trailLight.position.copy(droplet.position);

  // 镜头
  const { pos, look } = getShot(tt);
  camera.position.set(
    pos[0] + Math.sin(tt * 0.2) * 1.5,
    pos[1] + Math.sin(tt * 0.35) * 1.0,
    pos[2]
  );
  camera.lookAt(look[0], look[1], look[2]);

  // 舰队轻微漂移
  fleet.rotation.y = Math.sin(tt * 0.05) * 0.01;

  // 进度条
  document.getElementById('progress').style.width = (tt / DURATION * 100) + '%';
  // 标题淡入
  const title = document.getElementById('title');
  if (tt > 0.5 && tt < 3) title.classList.add('fade-in');

  composer.render();
}

// 标题 2 秒后淡入
setTimeout(() => document.getElementById('title').classList.add('fade-in'), 1500);

// 双驱动：rAF 主循环 + setInterval 兜底（后台标签页 rAF 被冻结时保底）
function animate() {
  renderFrame();
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
setInterval(() => {
  if (document.hidden) renderFrame(); // 后台时用 interval 续命，避免完全冻结
}, 100);

// 窗口缩放
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
